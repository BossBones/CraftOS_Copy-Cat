<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Emulador ComputerCraft</title>
    <style>
      /* Remove todas as margens e barras de rolagem padrão do navegador */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Força a div do emulador a preencher 100% da largura (vw) e altura (vh) da janela */
      #embed-computer {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- As tags header, main e footer foram removidas pois não são necessárias e ocupam espaço -->
    <div id="embed-computer"></div>

    <script type="text/javascript" src="https://copy-cat.squiddev.cc/require.js"></script>
    <script>
      require.config({ paths: { copycat: "https://copy-cat.squiddev.cc/" } });
      require(["copycat/embed"], setup => setup(document.getElementById("embed-computer")));
    </script>
  </body>
</html>
